spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: users-service
              uri: lb://users-service
              predicates:
                - Path=/api/v1/usuarios/**
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/cuentas/**
            - id: game-service
              uri: lb://game-service
              predicates:
                - Path=/api/v1/juegos/**
            - id: team-service
              uri: lb://team-service
              predicates:
                - Path=/api/v1/equipos/**
            - id: tournament-service
              uri: lb://tournament-service
              predicates:
                - Path=/api/v1/torneos/**
            - id: registration-service
              uri: lb://registration-service
              predicates:
                - Path=/api/v1/inscripciones/**
            - id: match-service
              uri: lb://match-service
              predicates:
                - Path=/api/v1/matchs/**
            - id: result-service
              uri: lb://result-service
              predicates:
                - Path=/api/v1/results/**
            - id: ranking-service
              uri: lb://ranking-service
              predicates:
                - Path=/api/v1/rankings/**
            - id: sanction-service
              uri: lb://sanction-service
              predicates:
                - Path=/api/v1/sanciones/**
            - id: prize-service
              uri: lb://prize-service
              predicates:
                - Path=/api/v1/premios/**
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notificaciones/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/