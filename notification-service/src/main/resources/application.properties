spring.application.name=notification-service
server.port=8011

spring.datasource.url=jdbc:h2:file:./data/notifications
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa


spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.api-docs.enable=true
springdoc.swagger-ui.enable=true
springdoc.swagger-ui.path=/docs/swagger-ui.html

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# CLAVE SECRETA JWT: debe ser EXACTAMENTE la misma en gateway y en los 3 microservicios.
jwt.secret=passwordAuth
jwt.expiration-minutes=60